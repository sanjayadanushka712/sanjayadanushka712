<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Sanjaya Danushka">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glowcore" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <filter id="textglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>
  <circle cx="600" cy="110" r="180" fill="url(#glowcore)"/>

  <!-- animated shine -->
  <rect x="-300" y="95" width="300" height="30" fill="url(#shine)" opacity="0.4">
    <animate attributeName="x" values="-300;1500" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- hex grid -->
  <g stroke="#00ff88" stroke-width="0.8" opacity="0.05">
    <line x1="100" y1="60" x2="200" y2="110"/>
    <line x1="200" y1="110" x2="100" y2="160"/>
    <line x1="100" y1="160" x2="0" y2="110"/>
    <line x1="0" y1="110" x2="100" y2="60"/>
    <line x1="1100" y1="60" x2="1200" y2="110"/>
    <line x1="1200" y1="110" x2="1100" y2="160"/>
    <line x1="1100" y1="160" x2="1000" y2="110"/>
    <line x1="1000" y1="110" x2="1100" y2="60"/>
  </g>

  <!-- content -->
  <g font-family="'Exo','Tourney','Inter',system-ui,sans-serif">
    <text x="600" y="96" font-size="54" font-weight="700" text-anchor="middle" fill="#00ff88" filter="url(#textglow)" letter-spacing="6">SANJAYA DANUSHKA</text>
    <text x="600" y="128" font-size="13" text-anchor="middle" fill="#b9ffdb" letter-spacing="22" opacity="0.8">SOFTWARE ENGINEER • DEVOPS</text>
  </g>

  <!-- bottom line -->
  <rect x="350" y="150" width="500" height="1" fill="#00ff88" opacity="0.25"/>
  <circle cx="350" cy="150" r="2" fill="#00ff88" opacity="0.6"/>
  <circle cx="850" cy="150" r="2" fill="#00ff88" opacity="0.6"/>
</svg>
