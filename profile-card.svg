<svg xmlns="http://www.w3.org/2000/svg" width="840" height="880" viewBox="0 0 840 880" role="img" aria-labelledby="title desc">
  <title id="title">Sanjaya Danushka — software engineer</title>
  <desc id="desc">A minimal editorial profile about software, DevOps, Linux, automation, and open source.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#56c8f5"/>
      <stop offset="1" stop-color="#1793d1"/>
    </linearGradient>
    <radialGradient id="wash" cx="0" cy="0" r="1" gradientTransform="translate(688 195) rotate(90) scale(300 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1793d1" stop-opacity=".15"/>
      <stop offset="1" stop-color="#1793d1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lines" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v12" stroke="#9aa4b2" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="840" height="880" rx="22" fill="#15181D"/>
  <rect width="840" height="880" rx="22" fill="url(#wash)"/>
  <rect x="1" y="1" width="838" height="878" rx="21" fill="none" stroke="#343b46" stroke-width="2"/>
  <path d="M570 0h248a22 22 0 0 1 22 22v420H570z" fill="url(#lines)" opacity=".8"/>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="54" y="64" fill="#7f8b99" font-size="15" letter-spacing="2">PROFILE <tspan fill="#1793d1">/</tspan> 01</text>
    <text x="786" y="64" text-anchor="end" fill="#7f8b99" font-size="15">ARCH LINUX</text>
  </g>

  <path d="M54 103h732" stroke="#343b46"/>
  <text x="50" y="211" fill="#f2f4f8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="74" font-weight="750" letter-spacing="-4">SANJAYA</text>
  <text x="50" y="292" fill="#f2f4f8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="74" font-weight="750" letter-spacing="-4">DANUSHKA<tspan fill="url(#blue)">.</tspan></text>

  <rect x="54" y="331" width="5" height="56" rx="2.5" fill="url(#blue)"/>
  <text x="77" y="353" fill="#dbe2ea" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Software Engineer</text>
  <text x="77" y="381" fill="#8994a3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">DevOps · Linux · Open Source</text>

  <text x="54" y="465" fill="#56c8f5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" letter-spacing="1">A LITTLE ABOUT HOW I WORK</text>
  <text x="54" y="511" fill="#d0d7e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Curious by nature. I enjoy shaping ideas into</text>
  <text x="54" y="543" fill="#d0d7e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">useful software, improving workflows, and</text>
  <text x="54" y="575" fill="#d0d7e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">learning by building.</text>

  <path d="M54 624h732" stroke="#343b46"/>
  <text x="54" y="672" fill="#7f8b99" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" letter-spacing="2">CURRENT CURIOSITIES</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">
    <rect x="54" y="701" width="153" height="42" rx="21" fill="#1793d1" fill-opacity=".13" stroke="#1793d1" stroke-opacity=".55"/>
    <text x="130" y="727" text-anchor="middle" fill="#8bd5f2">ARCH LINUX</text>
    <rect x="220" y="701" width="171" height="42" rx="21" fill="#202630" stroke="#3a424e"/>
    <text x="305" y="727" text-anchor="middle" fill="#c7d0dc">AUTOMATION</text>
    <rect x="404" y="701" width="177" height="42" rx="21" fill="#202630" stroke="#3a424e"/>
    <text x="492" y="727" text-anchor="middle" fill="#c7d0dc">OPEN SOURCE</text>
  </g>

  <path d="M54 790h732" stroke="#343b46"/>
  <text x="54" y="833" fill="#56c8f5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">$ keep_building --with-curiosity</text>
  <circle cx="782" cy="828" r="5" fill="#56c8f5"/>
</svg>
