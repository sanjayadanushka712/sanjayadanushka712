  <rect x="522" y="583" width="476" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="998" y="613" text-anchor="end" fill="#7f8997" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">SYSTEM READY <tspan fill="#a6e3a1">●</tspan></text>
