<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="670" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc">
  <title id="title">Sanjaya Danushka — profile and toolkit</title>
  <desc id="desc">A compact profile card with an English introduction and complete skills list.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2028"/><stop offset="1" stop-color="#15181D"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56c8f5"/><stop offset="1" stop-color="#a6e3a1"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1038" height="668" rx="24" fill="url(#bg)" stroke="#343b46" stroke-width="2"/>
  <path d="M1 58h1038" stroke="#343b46"/>
  <circle cx="30" cy="29" r="7" fill="#f38ba8"/><circle cx="54" cy="29" r="7" fill="#f9e2af"/><circle cx="78" cy="29" r="7" fill="#a6e3a1"/>
  <text x="520" y="35" text-anchor="middle" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">sanjaya@archlinux ~ $ ./profile.sh</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="42" y="116" fill="#a6e3a1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">HELLO, I'M</text>
    <text x="40" y="166" fill="#f2f4f8" font-size="37" font-weight="700" letter-spacing="-1">Sanjaya Danushka</text>
    <text x="42" y="199" fill="#8bd5ca" font-size="17">Software Engineer <tspan fill="#657080">/</tspan> DevOps</text>
    <path d="M42 223h414" stroke="#343b46"/>
    <text x="42" y="258" fill="#a6e3a1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">ABOUT</text>
    <text x="42" y="290" fill="#d0d7e1" font-size="15">Focused on Linux, automation, security, and</text>
    <text x="42" y="314" fill="#d0d7e1" font-size="15">building reliable software from development</text>
    <text x="42" y="338" fill="#d0d7e1" font-size="15">through deployment. Open-source contributor,</text>
    <text x="42" y="362" fill="#d0d7e1" font-size="15">always learning and sharing what I learn.</text>
    <path d="M42 390h414" stroke="#343b46"/>
    <text x="42" y="432" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">CURRENTLY INTO</text>
    <rect x="42" y="452" width="118" height="34" rx="17" fill="#1793d1" fill-opacity=".15" stroke="#1793d1" stroke-opacity=".5"/>
    <text x="101" y="474" text-anchor="middle" fill="#8bd5f2" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">ARCH LINUX</text>
    <rect x="170" y="452" width="136" height="34" rx="17" fill="#202630" stroke="#3a424e"/>
    <text x="238" y="474" text-anchor="middle" fill="#c7d0dc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">AUTOMATION</text>
    <rect x="316" y="452" width="140" height="34" rx="17" fill="#202630" stroke="#3a424e"/>
    <text x="386" y="474" text-anchor="middle" fill="#c7d0dc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">OPEN SOURCE</text>
    <path d="M42 514h414" stroke="#343b46"/>
    <text x="42" y="553" fill="#a6e3a1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">$ ./build-reliable-things.sh</text>
    <text x="42" y="589" fill="#8b949e" font-size="14">Learn · build · share</text>
  </g>

  <path d="M486 88v540" stroke="#343b46"/>
  <text x="522" y="116" fill="#a6e3a1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">$ pacman -Qe | head -n 4</text>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <rect x="522" y="145" width="476" height="94" rx="12" fill="#202630" stroke="#343b46"/>
    <text x="542" y="175" fill="#8bd5ca" font-size="13" letter-spacing="1">LANGUAGES</text>
    <text x="542" y="207" fill="#e5e9f0" font-size="15">Python · Java · Go · TypeScript · JavaScript</text>
    <text x="542" y="229" fill="#e5e9f0" font-size="15">Dart · Bash</text>

    <rect x="522" y="251" width="476" height="72" rx="12" fill="#202630" stroke="#343b46"/>
    <text x="542" y="281" fill="#8bd5ca" font-size="13" letter-spacing="1">FRONTEND &amp; UI</text>
    <text x="542" y="307" fill="#e5e9f0" font-size="15">Next.js · Flutter · React · Figma</text>

    <rect x="522" y="335" width="476" height="116" rx="12" fill="#202630" stroke="#343b46"/>
    <text x="542" y="365" fill="#8bd5ca" font-size="13" letter-spacing="1">PLATFORM, DEVOPS &amp; CLOUD</text>
    <text x="542" y="393" fill="#e5e9f0" font-size="15">Linux · Arch Linux · Docker · Kubernetes</text>
    <text x="542" y="418" fill="#e5e9f0" font-size="15">Jenkins · Terraform · AWS · Google Cloud · Azure</text>

    <rect x="522" y="463" width="476" height="94" rx="12" fill="#202630" stroke="#343b46"/>
    <text x="542" y="493" fill="#8bd5ca" font-size="13" letter-spacing="1">DATABASES &amp; TOOLS</text>
    <text x="542" y="525" fill="#e5e9f0" font-size="15">PostgreSQL · MongoDB · Supabase · Git</text>
    <text x="542" y="547" fill="#e5e9f0" font-size="15">GitHub · Sentry</text>
