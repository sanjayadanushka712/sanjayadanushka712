<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffa3" stop-opacity="0"/>
      <stop offset="18%" stop-color="#00ffa3" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="82%" stop-color="#ff2d55" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff2d55" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-20%" y="-500%" width="140%" height="1100%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dgrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#0e1c28" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- baseline rail -->
  <line x1="0" y1="30" x2="1200" y2="30" stroke="url(#dline)" stroke-width="2" filter="url(#dglow)"/>

  <!-- tick marks along the rail -->
  <g stroke="#00e5ff" stroke-width="1.5" opacity="0.35">
    <line x1="120" y1="24" x2="120" y2="36"/>
    <line x1="300" y1="24" x2="300" y2="36"/>
    <line x1="480" y1="24" x2="480" y2="36"/>
    <line x1="600" y1="20" x2="600" y2="40"/>
    <line x1="720" y1="24" x2="720" y2="36"/>
    <line x1="900" y1="24" x2="900" y2="36"/>
    <line x1="1080" y1="24" x2="1080" y2="36"/>
  </g>

  <!-- centered status chip -->
  <g font-family="'JetBrains Mono',monospace">
    <rect x="552" y="18" width="96" height="24" rx="4" fill="#060b12" stroke="#12222f"/>
    <circle cx="568" cy="30" r="3.5" fill="#00ffa3">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="580" y="35" font-size="12" fill="#00ffa3" letter-spacing="1.5">LINK</text>
  </g>

  <!-- traveling data packet (left -> right) -->
  <g filter="url(#dglow)">
    <rect x="-40" y="25" width="34" height="10" rx="2" fill="#00ffa3">
      <animate attributeName="x" values="-40;1206" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- counter packet (right -> left), red -->
  <g filter="url(#dglow)">
    <rect x="1240" y="25" width="22" height="10" rx="2" fill="#ff2d55">
      <animate attributeName="x" values="1240;-22" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- end caps -->
  <g stroke="#00ffa3" stroke-width="2" fill="none" opacity="0.8">
    <path d="M0 20 L0 40 M0 30 L14 30"/>
    <path d="M1200 20 L1200 40 M1200 30 L1186 30"/>
  </g>
</svg>
