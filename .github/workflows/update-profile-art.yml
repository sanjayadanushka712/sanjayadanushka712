name: Atualizar arte do perfil

"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - .github/workflows/update-profile-art.yml

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: python -m pip install -r scripts/requirements.txt
      - name: Consultar contribuições públicas do GitHub
        env:
          GH_PROFILE_USER: sanjayadanushka712
        run: python scripts/fetch_contributions.py
      - name: Gerar mapa de contribuições e estatísticas
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/render_stats_svg.py
      - name: Gerar retrato ASCII com a foto do perfil do GitHub
        run: |
          python scripts/fetch_avatar.py
          python scripts/make_ascii_svg.py
      - name: Salvar gráficos atualizados no repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualizar arte do perfil [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg sanjaya-ascii.svg"
