<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" aria-label="NeoArch">
  <defs>
    <linearGradient id="nabg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a12"/><stop offset="100%" stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="nan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36c8ff"/><stop offset="100%" stop-color="#2bff88"/>
    </linearGradient>
    <filter id="nag" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="560" height="200" rx="14" fill="url(#nabg)" stroke="#183a52"/>
  <!-- arch -->
  <g transform="translate(70,60)" filter="url(#nag)">
    <path d="M20 70 C20 20 50 0 60 0 C70 0 100 20 100 70" fill="none" stroke="url(#nan)" stroke-width="3"/>
    <path d="M20 70 C20 20 50 0 60 0 C70 0 100 20 100 70" fill="none" stroke="url(#nan)" stroke-width="12" opacity="0.12"/>
    <line x1="14" y1="70" x2="106" y2="70" stroke="url(#nan)" stroke-width="3"/>
    <!-- packages -->
    <rect x="30" y="44" width="24" height="24" rx="4" fill="#0a1626" stroke="#36c8ff"/>
    <rect x="66" y="44" width="24" height="24" rx="4" fill="#0a1626" stroke="#2bff88"/>
    <rect x="48" y="18" width="24" height="24" rx="4" fill="#0a1626" stroke="#39ffd0"/>
  </g>
  <g font-family="'JetBrains Mono',monospace">
    <text x="210" y="70" font-size="30" font-weight="800" fill="#eafff4" filter="url(#nag)">NeoArch</text>
    <text x="212" y="100" font-size="14" fill="#9fd0ef">Unified package manager for</text>
    <text x="212" y="120" font-size="14" fill="#9fd0ef">Arch Linux — Pacman · AUR · Flatpak · npm</text>
    <g font-size="12">
      <rect x="212" y="140" rx="10" width="70" height="24" fill="#0a2030" stroke="#1c5a7a"/>
      <text x="226" y="157" fill="#7fe3ff">Python</text>
      <rect x="290" y="140" rx="10" width="60" height="24" fill="#0a2030" stroke="#1c5a7a"/>
      <text x="304" y="157" fill="#7fe3ff">PyQt6</text>
      <rect x="358" y="140" rx="10" width="72" height="24" fill="#0a2030" stroke="#1c5a7a"/>
      <text x="372" y="157" fill="#7fe3ff">Docker</text>
    </g>
  </g>
</svg>
