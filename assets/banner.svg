<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Sanjaya Danushka — Dev Whale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04070b"/>
      <stop offset="45%" stop-color="#070d16"/>
      <stop offset="100%" stop-color="#0b0509"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffa3"/>
      <stop offset="45%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ff2d55"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#ff7a18"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1622"/>
      <stop offset="100%" stop-color="#060a10"/>
    </linearGradient>
    <radialGradient id="bloodglow" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#ff2d55" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff2d55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hardshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="edges" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#12202e" stroke-width="1" opacity="0.35"/>
    </pattern>
    <pattern id="scan" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="2" fill="#00e5ff" opacity="0.03"/>
    </pattern>
    <clipPath id="cardclip"><rect width="1200" height="380"/></clipPath>
  </defs>

  <g clip-path="url(#cardclip)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>

    <!-- red threat zone behind mask -->
    <circle cx="250" cy="205" r="210" fill="url(#bloodglow)"/>
    <circle cx="1050" cy="120" r="160" fill="url(#cyanglow)"/>

    <!-- radar / target rings -->
    <g fill="none" stroke="#00e5ff" opacity="0.18">
      <circle cx="250" cy="205" r="150"/>
      <circle cx="250" cy="205" r="110"/>
      <circle cx="250" cy="205" r="70"/>
      <circle cx="250" cy="205" r="200" stroke-dasharray="4 10" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate"
          from="0 250 205" to="360 250 205" dur="40s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- sweeping radar beam -->
    <g opacity="0.35">
      <path d="M250 205 L250 55 A150 150 0 0 1 356 130 Z" fill="#00ffa3" opacity="0.12">
        <animateTransform attributeName="transform" type="rotate"
          from="0 250 205" to="360 250 205" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- angular predator whale (shark-like) -->
    <g transform="translate(120,120)" filter="url(#hardshadow)">
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 8,-3; 0,0" dur="8s" repeatCount="indefinite"/>
        <g fill="url(#steel)" stroke="url(#neon)" stroke-width="2.4" filter="url(#edges)">
          <!-- main angular body -->
          <path d="M10 78 L60 34 L150 22 L230 40 L286 30 L300 44
                   L266 62 L240 88 L150 108 L70 104 L28 92 Z"/>
          <!-- dorsal fin (sharp) -->
          <path d="M120 24 L140 -18 L176 22 Z" fill="#0a121c" stroke="#00e5ff" stroke-width="2">
            <animateTransform attributeName="transform" type="rotate"
              values="-3 140 10; 3 140 10; -3 140 10" dur="4s" repeatCount="indefinite"/>
          </path>
          <!-- tail blades -->
          <path d="M6 78 L-34 44 L-12 70 L-40 78 L-10 86 L-30 108 L8 84 Z" fill="#0a121c" stroke="#ff2d55" stroke-width="2">
            <animateTransform attributeName="transform" type="rotate"
              values="-8 6 80; 8 6 80; -8 6 80" dur="1.4s" repeatCount="indefinite"/>
          </path>
        </g>
        <!-- gill threat lines -->
        <g stroke="#ff2d55" stroke-width="2" opacity="0.85">
          <line x1="86" y1="44" x2="80" y2="92"/>
          <line x1="102" y1="42" x2="96" y2="94"/>
          <line x1="118" y1="40" x2="112" y2="96"/>
        </g>
        <!-- narrowed predatory eye -->
        <g transform="translate(238,48)">
          <ellipse rx="16" ry="7" fill="#04070b" stroke="#ff2d55" stroke-width="2"/>
          <circle cx="3" cy="0" r="4" fill="#ff2d55" filter="url(#glow)">
            <animate attributeName="r" values="4;5;4" dur="1.8s" repeatCount="indefinite"/>
          </circle>
          <line x1="-18" y1="-14" x2="18" y2="-4" stroke="url(#neon)" stroke-width="3"/>
        </g>
        <!-- tech circuit veins -->
        <g stroke="#00ffa3" stroke-width="1" opacity="0.5" fill="none">
          <path d="M170 60 L200 60 L210 70 L240 70"/>
          <path d="M150 90 L180 90 L190 80 L220 80"/>
          <circle cx="200" cy="60" r="2" fill="#00ffa3"/>
          <circle cx="180" cy="90" r="2" fill="#00ffa3"/>
        </g>
      </g>
    </g>

    <!-- corner brackets (HUD) -->
    <g stroke="#00ffa3" stroke-width="2.5" fill="none" opacity="0.7">
      <path d="M18 18 L58 18 M18 18 L18 58"/>
      <path d="M1182 18 L1142 18 M1182 18 L1182 58"/>
      <path d="M18 362 L58 362 M18 362 L18 322"/>
      <path d="M1182 362 L1142 362 M1182 362 L1182 322"/>
    </g>

    <!-- title -->
    <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
      <text x="430" y="118" font-size="13" letter-spacing="6" fill="#ff2d55" filter="url(#glow)">// SOFTWARE ENGINEER · DEVOPS</text>
      <text x="426" y="176" font-size="70" font-weight="800" fill="#f4f9ff" filter="url(#glow)">SANJAYA DANUSHKA</text>
      <rect x="430" y="192" width="700" height="5" rx="2" fill="url(#danger)">
        <animate attributeName="width" values="700;640;700" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="430" y="232" font-size="24" font-weight="700" fill="url(#neon)">DEV WHALE 🐋</text>
      <text x="620" y="232" font-size="18" fill="#9fb4c7">Author of "The Art of Software Engineering"</text>
      <text x="430" y="262" font-size="16" fill="#7f95a8">Open-Source Contributor · Aviatrix ACE Multicloud Network Associate</text>
    </g>

    <!-- status HUD -->
    <g font-family="'JetBrains Mono',monospace" font-size="14">
      <rect x="430" y="286" width="120" height="26" rx="4" fill="#0a121c" stroke="#ff2d55"/>
      <circle cx="446" cy="299" r="4" fill="#ff2d55">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="458" y="304" fill="#ff2d55">BUILDING</text>
      <text x="566" y="304" fill="#8fd9bd">building not just software, but sustainable systems for others</text>
    </g>
  </g>

  <!-- scanlines overlay -->
  <rect width="1200" height="380" fill="url(#scan)" opacity="0.6"/>
  <!-- danger border -->
  <rect x="0" y="0" width="1200" height="380" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.35"/>
</svg>
