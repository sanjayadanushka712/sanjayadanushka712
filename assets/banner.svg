<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Sanjaya Danushka">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="200" fill="#000000"/>

  <!-- subtle matrix rain -->
  <g fill="#00ff41" font-family="'JetBrains Mono',monospace" font-size="12" opacity="0.12">
    <text x="40" y="-10">01<animate attributeName="y" values="-10;210" dur="6s" repeatCount="indefinite"/></text>
    <text x="80" y="-20">10<animate attributeName="y" values="-20;210" dur="7s" repeatCount="indefinite"/></text>
    <text x="120" y="-15">11<animate attributeName="y" values="-15;210" dur="6.5s" repeatCount="indefinite"/></text>
    <text x="160" y="-25">00<animate attributeName="y" values="-25;210" dur="7.5s" repeatCount="indefinite"/></text>
    <text x="200" y="-12">01<animate attributeName="y" values="-12;210" dur="6.8s" repeatCount="indefinite"/></text>
    <text x="240" y="-18">10<animate attributeName="y" values="-18;210" dur="7.2s" repeatCount="indefinite"/></text>
  </g>

  <!-- content -->
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
    <text x="70" y="80" font-size="14" fill="#00ff41" opacity="0.7">&gt; whoami</text>
    <text x="70" y="125" font-size="48" font-weight="700" fill="#00ff41" filter="url(#glow)">SANJAYA DANUSHKA</text>
    <rect x="72" y="136" width="540" height="2" rx="1" fill="#00ff41"/>
    <text x="72" y="162" font-size="16" fill="#00ff41">SOFTWARE ENGINEER | DEVOPS</text>
    <rect x="400" y="150" width="8" height="14" fill="#00ff41">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0" y="0" width="1200" height="200" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.2"/>
</svg>
