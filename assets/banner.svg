<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="1200" height="70" role="img" aria-label="sanjaya@devwhale:~$">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff41" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="70" fill="#000000"/>

  <!-- subtle CRT scanline -->
  <rect width="1200" height="14" fill="url(#scan)">
    <animate attributeName="y" values="-14;70" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- faint grid -->
  <g opacity="0.05" stroke="#00ff41" stroke-width="1">
    <line x1="0" y1="10" x2="1200" y2="10"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
  </g>

  <!-- terminal line -->
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="14">
    <text x="30" y="42" fill="#00ff41" filter="url(#glow)">sanjaya@devwhale:~$</text>
    <text x="250" y="42" fill="#f5fff7">cat identity.txt</text>
    <text x="420" y="42" fill="#00ff41" opacity="0.9">[</text>
    <text x="435" y="42" fill="#00ff41" filter="url(#glow)">SANJAYA DANUSHKA</text>
    <text x="625" y="42" fill="#9fffbb" opacity="0.8">|</text>
    <text x="640" y="42" fill="#9fffbb" opacity="0.8">SOFTWARE ENGINEER • DEVOPS</text>
    <text x="920" y="42" fill="#00ff41" opacity="0.9">]</text>
    <rect x="940" y="30" width="8" height="14" fill="#00ff41">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0" y="0" width="1200" height="70" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.18"/>
</svg>
