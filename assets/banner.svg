<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Sanjaya Danushka — Dev Whale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a0f"/>
      <stop offset="50%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#07160f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2bff88"/>
      <stop offset="50%" stop-color="#39ffd0"/>
      <stop offset="100%" stop-color="#36c8ff"/>
    </linearGradient>
    <linearGradient id="neonShift" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2bff88"/>
      <stop offset="50%" stop-color="#39ffd0"/>
      <stop offset="100%" stop-color="#36c8ff"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2bff88" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2bff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#163a2c" stroke-width="1" opacity="0.30"/>
    </pattern>
    <clipPath id="cardclip"><rect width="1200" height="380" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#cardclip)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>

    <!-- pulsing particle network -->
    <g stroke="#2bff88" stroke-width="1" opacity="0.28" fill="none">
      <path d="M980 60 L1060 90 L1150 70 L1180 130"/>
      <path d="M980 60 L1010 150 L1150 70"/>
      <path d="M1010 150 L1060 90"/>
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="5s" repeatCount="indefinite"/>
    </g>
    <g fill="#39ffd0">
      <circle cx="980" cy="60" r="3"><animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="90" r="2.5"><animate attributeName="r" values="1.5;3.5;1.5" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="70" r="3"><animate attributeName="r" values="2;4;2" dur="4.3s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="150" r="2.5"/>
      <circle cx="1180" cy="130" r="2"/>
    </g>
    <!-- left side small net -->
    <g stroke="#36c8ff" stroke-width="1" opacity="0.22" fill="none">
      <path d="M40 240 L120 210 L170 260 L110 300"/>
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g fill="#36c8ff">
      <circle cx="40" cy="240" r="2.5"/><circle cx="120" cy="210" r="2"/>
      <circle cx="170" cy="260" r="2.5"/><circle cx="110" cy="300" r="2"/>
    </g>

    <!-- ambient glow behind whale -->
    <circle cx="250" cy="200" r="140" fill="url(#glowCore)"/>

    <!-- swimming whale -->
    <g filter="url(#softglow)">
      <g transform="translate(150,150)">
        <animateTransform attributeName="transform" type="translate"
          values="150,150; 165,150; 150,150" dur="7s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="-2;2;-2" dur="5s" repeatCount="indefinite"/>
          <path d="M0 60 C0 25 32 0 78 0 C120 0 150 20 162 44
                   C176 38 196 40 210 52 C196 56 186 62 178 68
                   C168 96 132 116 84 116 C40 116 0 96 0 60 Z"
                fill="#08160f" stroke="url(#neon)" stroke-width="3"/>
          <path d="M40 96 C70 110 120 106 150 84 C130 100 80 104 54 96 Z" fill="#2bff88" opacity="0.16"/>
          <!-- tail flick -->
          <path d="M-2 60 C-18 52 -34 44 -46 36 C-30 40 -14 46 0 50 Z" fill="#0a1f18" stroke="url(#neon)" stroke-width="2">
            <animateTransform attributeName="transform" type="rotate"
              values="-6 0 60; 6 0 60; -6 0 60" dur="1.6s" repeatCount="indefinite"/>
          </path>
          <!-- eye -->
          <circle cx="120" cy="46" r="7" fill="#39ffd0" filter="url(#glow)">
            <animate attributeName="r" values="7;7;0.5;7;7" dur="6s" repeatCount="indefinite"/>
          </circle>
          <circle cx="122" cy="44" r="2.4" fill="#04120d"/>
          <!-- animated water spout -->
          <g stroke="url(#neon)" stroke-width="3" stroke-linecap="round" fill="none">
            <path d="M84 4 C84 -14 96 -20 96 -30">
              <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
            </path>
            <path d="M78 -2 C70 -16 58 -18 54 -28">
              <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/>
            </path>
          </g>
        </g>
      </g>
    </g>

    <!-- title text -->
    <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
      <text x="420" y="150" font-size="66" font-weight="800" fill="#eafff4" filter="url(#glow)">Sanjaya Danushka</text>
      <rect x="424" y="166" width="620" height="6" rx="3" fill="url(#neonShift)"/>
      <text x="424" y="212" font-size="25" fill="url(#neonShift)" font-weight="700">Dev Whale  🐋  ·  Software Engineer + DevOps</text>
      <text x="424" y="250" font-size="17" fill="#8fd9bd">Open-Source Contributor  ·  Author of "The Art of Software Engineering"</text>
      <text x="424" y="276" font-size="17" fill="#6fbfa2">Aviatrix ACE Multicloud Network Associate  ·  Badulla, Sri Lanka</text>
    </g>

    <!-- live status line -->
    <g font-family="'JetBrains Mono',monospace" font-size="15">
      <circle cx="432" cy="318" r="5" fill="#2bff88">
        <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="452" y="323" fill="#8fd9bd">status: building not just software, but sustainable systems for others</text>
    </g>
  </g>

  <rect x="0" y="0" width="1200" height="380" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.25"/>
</svg>
