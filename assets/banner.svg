<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Sanjaya Danushka — Dev Whale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c10"/>
      <stop offset="55%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0a1f18"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2bff88"/>
      <stop offset="50%" stop-color="#39ffd0"/>
      <stop offset="100%" stop-color="#36c8ff"/>
    </linearGradient>
    <linearGradient id="neon2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2bff88"/>
      <stop offset="100%" stop-color="#0fa968"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c3a2e" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <g opacity="0.5" stroke="#2bff88" stroke-width="1" fill="none">
    <circle cx="1080" cy="70" r="3"/><circle cx="1120" cy="120" r="2"/>
    <circle cx="1010" cy="260" r="2"/><circle cx="250" cy="60" r="2"/>
    <circle cx="180" cy="280" r="3"/><circle cx="420" cy="300" r="2"/>
  </g>
  <g stroke="url(#neon)" stroke-width="1" opacity="0.35" fill="none">
    <path d="M1000 90 L1080 70 L1120 120"/>
    <path d="M210 70 L250 60 L340 110"/>
    <path d="M160 260 L180 280 L300 250"/>
  </g>

  <!-- whale mascot -->
  <g transform="translate(150,110)" filter="url(#softglow)">
    <path d="M0 60 C0 25 32 0 78 0 C120 0 150 20 162 44
             C176 38 196 40 210 52 C196 56 186 62 178 68
             C168 96 132 116 84 116 C40 116 0 96 0 60 Z"
          fill="#0a1f18" stroke="url(#neon)" stroke-width="3"/>
    <!-- belly highlight -->
    <path d="M40 96 C70 110 120 106 150 84 C130 100 80 104 54 96 Z" fill="#2bff88" opacity="0.18"/>
    <!-- eye -->
    <circle cx="120" cy="46" r="7" fill="#39ffd0" filter="url(#glow)"/>
    <circle cx="122" cy="44" r="2.4" fill="#04120d"/>
    <!-- water spout -->
    <g stroke="url(#neon)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M84 4 C84 -14 96 -20 96 -30"/>
      <path d="M78 -2 C70 -16 58 -18 54 -28"/>
    </g>
  </g>

  <!-- text -->
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
    <text x="420" y="150" font-size="64" font-weight="800" fill="#eafff4" filter="url(#glow)">Sanjaya Danushka</text>
    <text x="424" y="196" font-size="24" fill="url(#neon)" font-weight="600">Dev Whale  🐋  ·  Software Engineer + DevOps</text>
    <text x="424" y="238" font-size="17" fill="#8fd9bd">Open-Source Contributor  ·  Author of "The Art of Software Engineering"</text>
    <text x="424" y="266" font-size="17" fill="#6fbfa2">Aviatrix ACE Multicloud Network Associate  ·  Badulla, Sri Lanka</text>
  </g>

  <!-- prompt line -->
  <g font-family="'JetBrains Mono',monospace" font-size="15">
    <text x="424" y="308" fill="#2bff88">~</text>
    <text x="442" y="308" fill="#39ffd0">$</text>
    <text x="462" y="308" fill="#8fd9bd">building not just software, but sustainable systems for others</text>
    <rect x="900" y="296" width="10" height="16" fill="#2bff88">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0" y="0" width="1200" height="340" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.25"/>
</svg>
