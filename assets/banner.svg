<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Sanjaya Danushka">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00ffaa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00ff88" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="200" fill="url(#bg)"/>
  <rect width="1200" height="200" fill="url(#dots)"/>

  <!-- top accent -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#grad)" opacity="0.4"/>

  <!-- animated line -->
  <line x1="0" y1="100" x2="0" y2="100" stroke="url(#grad)" stroke-width="1" opacity="0.4">
    <animate attributeName="x2" values="0;1200" dur="2.5s" repeatCount="indefinite"/>
  </line>

  <!-- content -->
  <g font-family="'Satoshi','Inter',system-ui,sans-serif">
    <text x="600" y="86" font-size="52" font-weight="800" text-anchor="middle" fill="url(#grad)" filter="url(#glow)" letter-spacing="-1">SANJAYA DANUSHKA</text>
    <text x="600" y="118" font-size="14" text-anchor="middle" fill="#9fffcc" letter-spacing="18" opacity="0.9">SOFTWARE ENGINEER • DEVOPS</text>
  </g>

  <!-- bottom accent -->
  <rect x="0" y="198" width="1200" height="2" fill="url(#grad)" opacity="0.4"/>
</svg>
