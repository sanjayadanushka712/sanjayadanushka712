<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Sanjaya Danushka — Dev Whale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03060a"/>
      <stop offset="50%" stop-color="#060b13"/>
      <stop offset="100%" stop-color="#0a0406"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffa3"/>
      <stop offset="45%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ff2d55"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#ff7a18"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101a26"/>
      <stop offset="100%" stop-color="#05080d"/>
    </linearGradient>
    <radialGradient id="bloodglow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff2d55" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ff2d55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hardshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#0f1c28" stroke-width="1" opacity="0.5"/>
    </pattern>
    <pattern id="scan" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="2" fill="#00e5ff" opacity="0.035"/>
    </pattern>
    <clipPath id="cardclip"><rect width="1200" height="400"/></clipPath>
  </defs>

  <g clip-path="url(#cardclip)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>

    <!-- threat glow zones -->
    <circle cx="250" cy="215" r="220" fill="url(#bloodglow)"/>
    <circle cx="1080" cy="90" r="170" fill="url(#cyanglow)"/>

    <!-- DATA STREAM (left column) -->
    <g font-family="'JetBrains Mono',monospace" font-size="12" fill="#00ffa3" opacity="0.45">
      <text x="14" y="360">0xA3F1 &#183; 0x9C22 &#183; 0x77BB &#183; 0xDE01</text>
      <text x="14" y="378" fill="#ff2d55" opacity="0.6">SIGINT :: CHANNEL SECURE</text>
      <text x="14" y="40" fill="#00e5ff" opacity="0.5">[ AUTH OK ]  SESSION 0x4E2A</text>
    </g>

    <!-- RADAR -->
    <g fill="none" stroke="#00e5ff" opacity="0.20">
      <circle cx="250" cy="215" r="165"/>
      <circle cx="250" cy="215" r="120"/>
      <circle cx="250" cy="215" r="76"/>
      <circle cx="250" cy="215" r="212" stroke-dasharray="3 11">
        <animateTransform attributeName="transform" type="rotate"
          from="0 250 215" to="360 250 215" dur="36s" repeatCount="indefinite"/>
      </circle>
      <line x1="250" y1="3" x2="250" y2="427" stroke-dasharray="2 12"/>
      <line x1="38" y1="215" x2="462" y2="215" stroke-dasharray="2 12"/>
    </g>
    <!-- sweeping beam -->
    <g opacity="0.5">
      <path d="M250 215 L250 50 A165 165 0 0 1 366 140 Z" fill="#00ffa3" opacity="0.14">
        <animateTransform attributeName="transform" type="rotate"
          from="0 250 215" to="360 250 215" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- blips -->
    <circle cx="330" cy="150" r="3" fill="#ff2d55">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="290" r="2.6" fill="#00ffa3">
      <animate attributeName="opacity" values="0;1;0" dur="3.1s" repeatCount="indefinite"/>
    </circle>

    <!-- TARGET LOCK reticle on whale -->
    <g stroke="#ff2d55" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.55">
      <path d="M60 60 L60 108 M60 60 L108 60"/>
      <path d="M350 60 L350 108 M350 60 L302 60"/>
      <path d="M60 320 L60 272 M60 320 L108 320"/>
      <path d="M350 320 L350 272 M350 320 L302 320"/>
      <animate attributeName="opacity" values="0.30;0.7;0.30" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <g stroke="#ff2d55" stroke-width="1" opacity="0.35">
      <line x1="205" y1="175" x2="205" y2="255" stroke-dasharray="3 6"/>
      <line x1="160" y1="215" x2="250" y2="215" stroke-dasharray="3 6"/>
    </g>

    <!-- ANGULAR PREDATOR WHALE -->
    <g transform="translate(112,128)" filter="url(#hardshadow)">
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 7,-3; 0,0" dur="8s" repeatCount="indefinite"/>
        <g fill="url(#steel)" stroke="url(#neon)" stroke-width="2.4" filter="url(#softglow)">
          <path d="M10 80 L64 34 L156 20 L238 40 L296 28 L312 44
                   L276 64 L248 92 L156 112 L72 108 L28 94 Z"/>
          <!-- sharp dorsal fin -->
          <path d="M126 22 L150 -22 L188 20 Z" fill="#0a121c" stroke="#00e5ff" stroke-width="2">
            <animateTransform attributeName="transform" type="rotate"
              values="-3 150 8; 3 150 8; -3 150 8" dur="4s" repeatCount="indefinite"/>
          </path>
          <!-- serrated tail blades -->
          <path d="M6 80 L-40 42 L-14 70 L-46 80 L-12 90 L-34 112 L8 86 Z"
                fill="#0a121c" stroke="#ff2d55" stroke-width="2">
            <animateTransform attributeName="transform" type="rotate"
              values="-9 6 82; 9 6 82; -9 6 82" dur="1.3s" repeatCount="indefinite"/>
          </path>
        </g>
        <!-- armor plating lines -->
        <g stroke="#00e5ff" stroke-width="1" opacity="0.35" fill="none">
          <path d="M70 62 L110 54 L150 62 L190 54"/>
          <path d="M70 96 L110 88 L150 96 L190 88"/>
        </g>
        <!-- gill threat lines -->
        <g stroke="#ff2d55" stroke-width="2" opacity="0.85">
          <line x1="92" y1="46" x2="86" y2="98"/>
          <line x1="110" y1="44" x2="104" y2="100"/>
          <line x1="128" y1="42" x2="122" y2="100"/>
        </g>
        <!-- circuit veins -->
        <g stroke="#00ffa3" stroke-width="1" opacity="0.5" fill="none">
          <path d="M176 62 L208 62 L218 72 L248 72"/>
          <path d="M156 92 L188 92 L198 82 L228 82"/>
          <circle cx="208" cy="62" r="2" fill="#00ffa3"/>
          <circle cx="188" cy="92" r="2" fill="#00ffa3"/>
        </g>
        <!-- narrowed predatory eye -->
        <g transform="translate(248,50)">
          <ellipse rx="17" ry="7" fill="#04070b" stroke="#ff2d55" stroke-width="2"/>
          <circle cx="3" cy="0" r="4" fill="#ff2d55" filter="url(#glow)">
            <animate attributeName="r" values="4;5.2;4" dur="1.8s" repeatCount="indefinite"/>
          </circle>
          <line x1="-19" y1="-15" x2="19" y2="-4" stroke="url(#neon)" stroke-width="3"/>
        </g>
      </g>
    </g>

    <!-- HUD CORNER BRACKETS -->
    <g stroke="#00ffa3" stroke-width="2.5" fill="none" opacity="0.75">
      <path d="M18 18 L58 18 M18 18 L18 58"/>
      <path d="M1182 18 L1142 18 M1182 18 L1182 58"/>
      <path d="M18 382 L58 382 M18 382 L18 342"/>
      <path d="M1182 382 L1142 382 M1182 382 L1182 342"/>
    </g>
    <!-- side ticks -->
    <g stroke="#00e5ff" stroke-width="1.5" opacity="0.4">
      <line x1="18" y1="160" x2="34" y2="160"/>
      <line x1="18" y1="200" x2="34" y2="200"/>
      <line x1="18" y1="240" x2="34" y2="240"/>
      <line x1="1166" y1="160" x2="1182" y2="160"/>
      <line x1="1166" y1="200" x2="1182" y2="200"/>
      <line x1="1166" y1="240" x2="1182" y2="240"/>
    </g>

    <!-- TITLE -->
    <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
      <text x="432" y="112" font-size="13" letter-spacing="6" fill="#ff2d55" filter="url(#glow)">// SOFTWARE ENGINEER · DEVOPS · OPERATOR</text>
      <text x="428" y="172" font-size="70" font-weight="800" fill="#f4f9ff" filter="url(#glow)">SANJAYA DANUSHKA</text>
      <rect x="432" y="188" width="700" height="5" rx="2" fill="url(#danger)">
        <animate attributeName="width" values="700;636;700" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="432" y="228" font-size="24" font-weight="700" fill="url(#neon)">DEV WHALE 🐋</text>
      <text x="622" y="228" font-size="17" fill="#9fb4c7">Open-Source Contributor · OSDC</text>
      <text x="432" y="258" font-size="16" fill="#7f95a8">Aviatrix ACE Multicloud Network Associate · Badulla, Sri Lanka</text>
    </g>

    <!-- STATUS + ENCRYPTION GLYPHS -->
    <g font-family="'JetBrains Mono',monospace" font-size="14">
      <rect x="432" y="286" width="132" height="27" rx="4" fill="#0a121c" stroke="#ff2d55"/>
      <circle cx="450" cy="299.5" r="4" fill="#ff2d55">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" repeatCount="indefinite"/>
      </circle>
      <text x="462" y="305" fill="#ff2d55">BUILDING</text>
      <text x="580" y="305" fill="#8fd9bd">building sustainable systems for others</text>
      <text x="432" y="336" fill="#00ffa3" opacity="0.65" font-size="13">$ rot13 :: 0xDEADBEEF :: integrity OK :: channel: secure</text>
    </g>

    <!-- cursor -->
    <rect x="790" y="322" width="9" height="16" fill="#00ffa3">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- glitch flash bar -->
    <rect x="0" y="0" width="1200" height="400" fill="#ff2d55" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0.06;0;0;0;0;0;0.04;0" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect width="1200" height="400" fill="url(#scan)" opacity="0.7"/>
  <rect x="0" y="0" width="1200" height="400" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.35"/>
</svg>
