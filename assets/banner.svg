<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Sanjaya Danushka">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#050a07"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#102015" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>

  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
    <text x="80" y="110" font-size="16" fill="#00ff88" opacity="0.8">[ root@devwhale ~ ]$</text>
    <text x="80" y="150" font-size="58" font-weight="700" fill="#f8fff9" filter="url(#glow)">SANJAYA DANUSHKA</text>
    <rect x="82" y="164" width="680" height="3" rx="1.5" fill="url(#bar)">
      <animate attributeName="width" values="680;620;680" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="82" y="200" font-size="20" fill="#00ff88">Software Engineer • DevOps</text>
    <text x="82" y="232" font-size="16" fill="#6f9f7a">> building clean, minimal &amp; efficient systems</text>
    <rect x="480" y="218" width="9" height="16" fill="#00ff88">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0" y="0" width="1200" height="280" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.25"/>
</svg>
