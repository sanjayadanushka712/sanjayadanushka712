<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" width="1100" height="390" role="img" aria-label="Tech stack">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#020a05"/>
    </linearGradient>
    <linearGradient id="sline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00ff88" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#00ff88" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <filter id="sglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1098" height="388" rx="10" fill="url(#sbg)"/>
  <rect x="1" y="1" width="1098" height="388" rx="10" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.22"/>

  <g stroke="#00ff88" stroke-width="2" fill="none" opacity="0.75">
    <path d="M12 40 L12 12 L40 12"/>
    <path d="M1088 350 L1088 378 L1060 378"/>
  </g>

  <rect x="40" y="34" width="300" height="1" fill="url(#sline)"/>

  <text x="40" y="76" font-family="'Exo 2',sans-serif" font-size="14" letter-spacing="6"
        fill="#00ff88" filter="url(#sglow)">// STACK</text>

  <!-- labels -->
  <g font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="2" fill="#4f8f72">
    <text x="40" y="117">CORE</text>
    <text x="40" y="167">FRONTEND</text>
    <text x="40" y="217">UI/UX</text>
    <text x="40" y="267">PLATFORM</text>
    <text x="40" y="317">DATA</text>
  </g>

  <!-- separators -->
  <g stroke="#00ff88" stroke-width="1" opacity="0.07">
    <line x1="40" y1="134" x2="1060" y2="134"/>
    <line x1="40" y1="184" x2="1060" y2="184"/>
    <line x1="40" y1="234" x2="1060" y2="234"/>
    <line x1="40" y1="284" x2="1060" y2="284"/>
