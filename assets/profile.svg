<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Sanjaya Danushka — profile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="55%" stop-color="#010704"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#00ff88" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#8affc1"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#00ff88" opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="758" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="758" rx="14" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="758" rx="14" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.22"/>

  <circle cx="600" cy="130" r="220" fill="url(#core)"/>

  <g stroke="#00ff88" stroke-width="2" fill="none" opacity="0.7">
    <path d="M18 52 L18 18 L52 18"/>
    <path d="M1182 708 L1182 742 L1148 742"/>
  </g>

  <!-- HEADER -->
  <g font-family="'Exo 2','JetBrains Mono',system-ui,sans-serif">
    <text x="56" y="64" font-size="13" letter-spacing="6" fill="#00ff88" opacity="0.8">// PROFILE</text>
    <text x="56" y="128" font-size="46" font-weight="700" letter-spacing="3" fill="url(#nameGrad)" filter="url(#glow)">SANJAYA DANUSHKA</text>
    <text x="58" y="162" font-size="15" letter-spacing="7" fill="#7fdcae">SOFTWARE ENGINEER &#8226; DEVOPS</text>
  </g>

  <rect x="56" y="192" width="1088" height="1" fill="url(#rule)"/>

  <!-- ABOUT -->
  <g font-family="'Exo 2','JetBrains Mono',system-ui,sans-serif">
    <text x="56" y="228" font-size="13" letter-spacing="6" fill="#00ff88" filter="url(#glow)">// ABOUT</text>
    <g font-size="17" fill="#c9f7e5">
      <text x="56" y="264">Highly motivated Software Engineer &amp; DevOps practitioner with deep experience building complete</text>
      <text x="56" y="292">end-to-end systems — from application design &amp; development to automation, deployment &amp; monitoring.</text>
      <text x="56" y="320">Combining a Software Engineering mindset with DevOps principles, I design, code, containerize &amp;</text>
      <text x="56" y="348">deploy scalable solutions across modern cloud platforms on <tspan fill="#00ff88">Arch Linux</tspan>.</text>
    </g>
    <text x="56" y="384" font-size="15" font-style="italic" fill="#6fbf9a">Driven by open-source collaboration, research &amp; accessible tech education to innovate &amp; share knowledge.</text>
    <text x="1144" y="384" font-size="14" text-anchor="end" fill="#00ff88" opacity="0.85">— Sanjaya Danushka</text>
  </g>

  <rect x="56" y="414" width="1088" height="1" fill="url(#rule)"/>

  <!-- STACK -->
  <g font-family="'Exo 2','JetBrains Mono',system-ui,sans-serif">
    <text x="56" y="450" font-size="13" letter-spacing="6" fill="#00ff88" filter="url(#glow)">// STACK</text>
  </g>

  <g font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="2" fill="#4f8f72">
    <text x="56" y="491">CORE</text>
    <text x="56" y="541">FRONTEND</text>
    <text x="56" y="591">UI/UX</text>
    <text x="56" y="641">PLATFORM</text>
    <text x="56" y="691">DATA</text>
  </g>

