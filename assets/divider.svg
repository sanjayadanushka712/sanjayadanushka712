<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" role="img" aria-label="divider">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2bff88" stop-opacity="0"/>
      <stop offset="35%" stop-color="#2bff88" stop-opacity="1"/>
      <stop offset="65%" stop-color="#36c8ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#36c8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dg" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="0" y1="20" x2="1200" y2="20" stroke="url(#d)" stroke-width="2" filter="url(#dg)"/>
  <circle cx="600" cy="20" r="4" fill="#2bff88" filter="url(#dg)">
    <animate attributeName="cx" values="560;640;560" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
