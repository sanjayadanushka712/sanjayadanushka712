    <path d="M1182 708 L1182 742 L1148 742"/>
  </g>

  <!-- HEADER -->
  <g font-family="'Exo 2','JetBrains Mono',system-ui,sans-serif">
    <text x="56" y="64" font-size="13" letter-spacing="6" fill="#00ff88" opacity="0.8">// PROFILE</text>
    <text x="56" y="128" font-size="46" font-weight="700" letter-spacing="3" fill="url(#nameGrad)" filter="url(#glow)">SANJAYA DANUSHKA</text>
    <text x="58" y="162" font-size="15" letter-spacing="7" fill="#7fdcae">SOFTWARE ENGINEER &#8226; DEVOPS</text>
  </g>

  <rect x="56" y="192" width="1088" height="1" fill="url(#rule)"/>

  <!-- ABOUT -->
  <g font-family="'Exo 2','JetBrains Mono',system-ui,sans-serif">
    <text x="56" y="228" font-size="13" letter-spacing="6" fill="#00ff88" filter="url(#glow)">// ABOUT</text>
    <g font-size="17" fill="#c9f7e5">
      <text x="56" y="264">Software Engineer with DevOps skills, passionate about building, automating, and deploying</text>
      <text x="56" y="292">scalable end-to-end solutions. Open-source contributor on GitHub, dedicated to continuous</text>
      <text x="56" y="320">learning, innovation, and accessible technology.</text>
    </g>
    <text x="56" y="356" font-size="15" font-style="italic" fill="#6fbf9a">Driven by automation, reliability &amp; sharing knowledge with the community.</text>
    <text x="1144" y="356" font-size="14" text-anchor="end" fill="#00ff88" opacity="0.85">— Sanjaya Danushka</text>
  </g>

  <rect x="56" y="386" width="1088" height="1" fill="url(#rule)"/>

