<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Sanjaya Danushka — profile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="55%" stop-color="#010704"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#00ff88" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#8affc1"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#00ff88" opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="758" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="758" rx="14" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="758" rx="14" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.22"/>

  <!-- ARCH LINUX LOGO -->
  <g opacity="0.09" transform="translate(980, 540) scale(1.6)">
    <path d="M 0 -40 C 8 -28 16 -16 24 0 C 18 6 12 12 6 18 C 4 12 2 6 0 0 C -2 6 -4 12 -6 18 C -12 12 -18 6 -24 0 C -16 -16 -8 -28 0 -40 Z" fill="#00ff88"/>
    <path d="M 0 -10 C 3 -6 6 -2 9 2 C 7 5 5 8 3 11 C 2 7 1 3 0 -1 C -1 3 -2 7 -3 11 C -5 8 -7 5 -9 2 C -6 -2 -3 -6 0 -10 Z" fill="#000000" opacity="0.6"/>
  </g>

  <circle cx="600" cy="130" r="220" fill="url(#core)"/>

  <g stroke="#00ff88" stroke-width="2" fill="none" opacity="0.7">
